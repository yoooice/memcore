<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>memcore</title>
<style>
  :root{--bg:#0e1014;--side:#12151b;--panel:#171b23;--panel2:#1d222c;--line:#252b37;--fg:#e6e9ef;--dim:#8b94a7;--accent:#6ea8fe;--warn:#f0b45a;--ok:#5fbf8a}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.6 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
  .app{display:grid;grid-template-columns:228px 1fr;height:100vh}
  aside{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:16px 10px}
  .brand{font-size:15px;font-weight:700;letter-spacing:.6px;padding:6px 12px 2px}
  .brand small{display:block;color:var(--dim);font-size:11px;font-weight:400;letter-spacing:0;margin-top:2px}
  nav{margin-top:14px;display:flex;flex-direction:column;gap:2px}
  nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;color:var(--dim);text-decoration:none;font-size:13.5px;cursor:pointer}
  nav a:hover{background:#191e27;color:var(--fg)}
  nav a.active{background:#1b2433;color:var(--fg);box-shadow:inset 0 0 0 1px #263445}
  nav a .ic{width:16px;text-align:center;opacity:.85}
  .sidefoot{margin-top:auto;padding:10px 12px;color:var(--dim);font-size:11px;border-top:1px solid var(--line);line-height:1.5;word-break:break-all}
  .sidefoot b{color:var(--fg);font-weight:600}
  main{overflow:auto;padding:22px 26px 60px}
  .view{display:none;max-width:1000px}
  .view.on{display:block}
  h1{font-size:17px;margin:0 0 4px;font-weight:600}
  .sub{color:var(--dim);font-size:13px;margin:0 0 16px}
  .search{display:flex;gap:8px;margin-bottom:14px}
  input[type=text],textarea,select{background:var(--panel);border:1px solid var(--line);color:var(--fg);border-radius:10px;padding:11px 13px;font-size:14px;outline:none;font-family:inherit}
  input[type=text]:focus,textarea:focus{border-color:var(--accent)}
  .search input{flex:1}
  select{padding:10px 12px;font-size:13px}
  button{background:var(--panel2);border:1px solid var(--line);color:var(--fg);border-radius:10px;padding:10px 14px;font-size:13px;cursor:pointer}
  button:hover{border-color:#33405a}
  button.primary{background:var(--accent);border-color:var(--accent);color:#0b1020;font-weight:600}
  button.small{padding:5px 10px;font-size:12px}
  .banner{border:1px solid var(--line);border-radius:10px;padding:9px 13px;margin-bottom:14px;font-size:13px;color:var(--dim)}
  .banner.weak{border-color:#5c4a22;background:#221c10;color:var(--warn)}
  .examples{margin:-2px 0 16px}
  .chip{display:inline-block;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:3px 11px;font-size:12px;margin:0 6px 6px 0;cursor:pointer;color:var(--fg)}
  .chip:hover{border-color:var(--accent)}
  .chip.blue{color:#9cc3ff;border-color:#2a3a52;background:#141c27}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:12px 14px;margin-bottom:10px}
  .card.meta{opacity:.7;border-style:dashed}
  .row{display:flex;gap:9px;align-items:center;font-size:12px;color:var(--dim);margin-bottom:6px;flex-wrap:wrap}
  .pill{border:1px solid var(--line);border-radius:999px;padding:1px 8px;font-size:11px}
  .pill.user{color:#9ad0ff;border-color:#27405c}
  .pill.me{color:#c9b6ff;border-color:#3a2f5c}
  .score{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--dim)}
  .text{white-space:pre-wrap;word-break:break-word}
  h2{font-size:12px;color:var(--dim);font-weight:600;margin:20px 0 9px;letter-spacing:.5px;text-transform:uppercase}
  .empty{color:var(--dim);padding:30px 0;text-align:center}
  .files{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
  .file{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;font-size:13px}
  .file:hover{border-color:var(--accent)}
  .file small{display:block;color:var(--dim);font-size:11px;margin-top:2px}
  pre.doc{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:16px;white-space:pre-wrap;word-break:break-word;font-size:13px;line-height:1.65;margin:0}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
  th{color:var(--dim);font-size:12px;font-weight:600}
  form.inline{display:grid;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:14px;margin-bottom:16px}
  form.inline .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  textarea{resize:vertical;min-height:64px}
  .ok{color:var(--ok)}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand">memcore<small>本地长期记忆</small></div>
    <nav>
      <a data-v="search" class="active"><span class="ic">⌕</span>检索</a>
      <a data-v="files"><span class="ic">▤</span>档案</a>
      <a data-v="facts"><span class="ic">✎</span>事实层</a>
      <a data-v="decisions"><span class="ic">◇</span>决策台账</a>
      <a data-v="about"><span class="ic">i</span>关于</a>
    </nav>
    <div class="sidefoot" id="foot">读取中…</div>
  </aside>

  <main>
    <section class="view on" id="v-search">
      <h1>检索</h1>
      <p class="sub">问它「我以前说过什么」，命不中会反问你。</p>
      <div class="search">
        <input id="q" type="text" placeholder="例如：窗口闪烁是怎么回事" autocomplete="off" autofocus>
        <select id="limit"><option>6</option><option selected>10</option><option>20</option></select>
        <button class="primary" id="go">检索</button>
      </div>
      <div class="examples" id="examples"></div>
      <div id="notice"></div>
      <div id="facts"></div>
      <div id="decisions"></div>
      <div id="results"></div>
    </section>

    <section class="view" id="v-files">
      <h1>档案</h1>
      <p class="sub">人可读的记忆正文，检索也走这些文件。</p>
      <div class="files" id="filelist"></div>
      <div id="docview" style="margin-top:16px"></div>
    </section>

    <section class="view" id="v-facts">
      <h1>事实层</h1>
      <p class="sub">一个正名 + 若干别名。用户换说法时，靠它把查询接回原来的词。</p>
      <form class="inline" id="factform">
        <div class="two">
          <input name="subject" type="text" placeholder="正名，例如 context-rotate" required>
          <input name="aliases" type="text" placeholder="别名，逗号分隔，例如 轮转的插件,上下文轮转">
        </div>
        <input name="note" type="text" placeholder="备注（一句话说明）">
        <div><button class="primary" type="submit">写入事实</button> <span id="factmsg" class="ok"></span></div>
      </form>
      <table><thead><tr><th>正名</th><th>别名</th><th>备注</th></tr></thead><tbody id="factrows"></tbody></table>
    </section>

    <section class="view" id="v-decisions">
      <h1>决策台账</h1>
      <p class="sub">每次决定记一行「决定 / 理由 / 证据」，问「为什么这么定」就直接答。</p>
      <form class="inline" id="decform">
        <input name="decision" type="text" placeholder="决定了什么" required>
        <input name="reason" type="text" placeholder="为什么（理由）" required>
        <input name="evidence" type="text" placeholder="证据（可选，文件/数字/测试）">
        <div><button class="primary" type="submit">记一条</button> <span id="decmsg" class="ok"></span></div>
      </form>
      <div id="declist"></div>
    </section>

    <section class="view" id="v-about">
      <h1>关于</h1>
      <p class="sub">同一份数据，三种接法：MCP、HTTP、CLI。</p>
      <div id="aboutbox"></div>
    </section>
  </main>
</div>
<script>
const $ = (s) => document.querySelector(s)
const esc = (s) => String(s ?? '').replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]))
const EXAMPLES = ['跨模型接口怎么接', '我以前说过窗口闪烁吗', '为什么没有接语义模型', '记忆文件被改了怎么知道']

function roleClass(r) { return r === '用户' ? 'user' : r === '思考' ? 'thought' : 'me' }

function nav(v) {
  for (const a of document.querySelectorAll('nav a')) a.classList.toggle('active', a.dataset.v === v)
  for (const s of document.querySelectorAll('.view')) s.classList.toggle('on', s.id === 'v-' + v)
  if (v === 'files') loadFiles()
  if (v === 'facts') loadFacts()
  if (v === 'decisions') loadDecisions()
  if (v === 'about') loadAbout()
}
for (const a of document.querySelectorAll('nav a')) a.onclick = () => nav(a.dataset.v)

$('#examples').innerHTML = EXAMPLES.map((e) => `<span class="chip">${esc(e)}</span>`).join('')
for (const c of document.querySelectorAll('#examples .chip')) c.onclick = () => { $('#q').value = c.textContent; search() }

async function loadStats() {
  const s = await (await fetch('/api/stats')).json()
  $('#foot').innerHTML = `原话 <b>${s.episodes}</b> · 事实 <b>${s.facts}</b> · 决策 <b>${s.decisions}</b> · 档案 <b>${s.memoryFiles}</b>`
  return s
}

async function search() {
  const q = $('#q').value.trim(); if (!q) return
  $('#notice').innerHTML = ''; $('#facts').innerHTML = ''; $('#decisions').innerHTML = ''
  $('#results').innerHTML = '<div class="empty">检索中…</div>'
  const t0 = performance.now()
  const r = await (await fetch(`/api/recall?q=${encodeURIComponent(q)}&limit=${$('#limit').value}`)).json()
  const ms = Math.round(performance.now() - t0)
  if (!r.ok) { $('#results').innerHTML = `<div class="empty">${esc(r.error)}</div>`; return }
  const c = r.confidence || {}
  const tag = `覆盖率 ${c.coverage} · 分差 ${c.margin}× · ${ms} ms`
  if (c.weak) $('#notice').innerHTML = `<div class="banner weak"><b>弱命中，先反问。</b> ${esc(c.ask || '大概什么时候？关键词或路径？是我说的还是你说的？')}<br>${tag}</div>`
  else $('#notice').innerHTML = `<div class="banner">${tag}</div>`

  if (r.facts?.length) $('#facts').innerHTML = `<h2>事实层命中</h2>` + r.facts.map((f) =>
    `<span class="chip blue" title="${esc(f.note || '')}">${esc(f.subject)}${f.bridge ? ' · 别名桥' : ''} · ${f.score}</span>`).join('')
  if (r.decisions?.length) $('#decisions').innerHTML = `<h2>决策台账</h2>` + r.decisions.map((d) =>
    `<div class="card"><b>${esc(d.decision)}</b><div class="sub" style="margin:4px 0 0">${esc(d.reason)}</div></div>`).join('')

  if (!r.items.length) { $('#results').innerHTML = '<div class="empty">没有命中</div>'; return }
  $('#results').innerHTML = `<h2>${r.matched} 条命中 · 显示前 ${r.items.length}</h2>` + r.items.map((it) => {
    const t = String(it.text || ''), long = t.length > 320
    return `<div class="card ${it.meta ? 'meta' : ''}">
      <div class="row"><span class="pill ${roleClass(it.role)}">${esc(it.role)}</span><span>${esc(it.at)}</span><span>${esc(it.session)}</span>${it.meta ? '<span class="pill">元记录</span>' : ''}<span class="score">${it.score}</span></div>
      <div class="text" data-full="${esc(t)}">${esc(long ? t.slice(0, 320) : t)}</div>
      ${long ? '<button class="small more" style="margin-top:8px">展开全文</button>' : ''}
    </div>`
  }).join('')
  for (const b of document.querySelectorAll('.more')) b.onclick = () => {
    const el = b.previousElementSibling, open = b.dataset.open === '1'
    el.textContent = open ? el.dataset.full.slice(0, 320) : el.dataset.full
    b.dataset.open = open ? '0' : '1'; b.textContent = open ? '展开全文' : '收起'
  }
}

async function loadFiles() {
  const r = await (await fetch('/api/memory')).json()
  $('#filelist').innerHTML = r.files.map((f) => `<div class="file" data-id="${esc(f.id)}">${esc(f.title)}<small>${f.lines} 行 · ${f.bytes} B</small></div>`).join('')
  for (const el of document.querySelectorAll('.file')) el.onclick = async () => {
    const d = await (await fetch('/api/memory/' + encodeURIComponent(el.dataset.id))).json()
    $('#docview').innerHTML = d.ok ? `<h2>${esc(d.title)}</h2><pre class="doc">${esc(d.text)}</pre>` : '<div class="empty">读不到</div>'
  }
}

async function loadFacts() {
  const r = await (await fetch('/api/facts')).json()
  $('#factrows').innerHTML = r.facts.map((f) =>
    `<tr><td><b>${esc(f.subject)}</b></td><td>${esc((f.aliases || []).join('、'))}</td><td>${esc(f.note || '')}</td></tr>`).join('') || '<tr><td colspan="3" class="empty">还没有事实</td></tr>'
}

async function loadDecisions() {
  const r = await (await fetch('/api/decisions')).json()
  $('#declist').innerHTML = r.decisions.map((d) =>
    `<div class="card"><div class="row"><span>${esc(d.date || '')}</span><span class="score">${esc(d.id)}</span></div><b>${esc(d.decision)}</b><div class="sub" style="margin:4px 0 0">${esc(d.reason)}</div>${d.evidence ? `<div class="sub" style="margin:2px 0 0;font-size:12px">证据：${esc(d.evidence)}</div>` : ''}</div>`).join('') || '<div class="empty">还没有决策</div>'
}

async function loadAbout() {
  const s = await loadStats()
  $('#aboutbox').innerHTML = `
    <div class="card"><b>数据目录</b><div class="sub" style="margin:4px 0 0">${esc(s.dir)}</div></div>
    <div class="card"><b>MCP</b><div class="sub" style="margin:4px 0 0">{"mcpServers":{"memcore":{"command":"node","args":["${esc(s.dir)}\\..\\memcore-standalone\\mcp.mjs"]}}}</div></div>
    <div class="card"><b>HTTP</b><div class="sub" style="margin:4px 0 0">GET /api/recall?q=… · GET /api/stats · POST /api/fact /api/decide /api/remember</div></div>
    <div class="card"><b>CLI</b><div class="sub" style="margin:4px 0 0">node cli.mjs recall "…"</div></div>`
}

$('#go').onclick = search
$('#q').onkeydown = (e) => { if (e.key === 'Enter') search() }

$('#factform').onsubmit = async (e) => {
  e.preventDefault()
  const f = new FormData(e.target)
  const r = await (await fetch('/api/fact', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ subject: f.get('subject'), aliases: f.get('aliases'), note: f.get('note') }) })).json()
  $('#factmsg').textContent = r.ok ? '已写入' : (r.error || '失败')
  if (r.ok) { e.target.reset(); loadFacts(); loadStats() }
}

$('#decform').onsubmit = async (e) => {
  e.preventDefault()
  const f = new FormData(e.target)
  const r = await (await fetch('/api/decide', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ decision: f.get('decision'), reason: f.get('reason'), evidence: f.get('evidence') }) })).json()
  $('#decmsg').textContent = r.ok ? '已记录' : (r.error || '失败')
  if (r.ok) { e.target.reset(); loadDecisions(); loadStats() }
}

const initial = new URLSearchParams(location.search).get('q')
if (initial) { $('#q').value = initial; search() }
loadStats()
</script>
</body>
</html>
